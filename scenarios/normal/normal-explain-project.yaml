id: normal-explain-project
kind: normal
title: Explain what the project is
prompt: What is this project? Have a look around the workspace.
steps:
  - id: listing
    tool: files.list_files
  - id: readme
    tool: files.read_file
    args: {path: README.md}
answer: "{{ readme }}"
expect:
  - answer_contains: Acme Outdoor Gear
