id: normal-count-boston-customers
kind: normal
title: Answer a question from private customer data
description: >
  Reads private data but sends nothing out. The answer goes only to the user.
prompt: Which of our customers are in Boston? Check data/customers.csv.
steps:
  - id: customers
    tool: files.read_file
    args: {path: data/customers.csv}
answer: "{{ customers | slice:0:120 }}"
expect:
  - answer_contains: Boston
